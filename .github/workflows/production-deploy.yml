name: Production Deployment Gate

on:
  push:
    branches: ["production"]

jobs:
  deploy-to-render:
    name: Trigger Live Render Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Webhook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
        run: |
          echo "Initiating production release deployment..."
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Deployment hook dispatched successfully."
